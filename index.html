<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Collection Gauntlet</title>
<meta name="theme-color" content="#1F4A38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gauntlet">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Marcellus&family=Sorts+Mill+Goudy:ital@0;1&display=swap');
:root {
  --paper:#EFE9D8; --paper-deep:#E4DCC6; --ink:#23301F;
  --rail-green:#1F4A38; --rail-green-deep:#143327; --brass:#A67C2E;
  --oxblood:#6E2A24; --oxblood-deep:#4E1D19;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;background:var(--paper);
  background-image:radial-gradient(ellipse at 50% -10%,rgba(255,255,255,.55),transparent 60%),
    repeating-linear-gradient(0deg,transparent 0 26px,rgba(31,74,56,.045) 26px 27px);
  color:var(--ink);font-family:'Sorts Mill Goudy',Georgia,serif;font-size:18px;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(44px + env(safe-area-inset-bottom));
}
body.sell-theme{
  background-image:radial-gradient(ellipse at 50% -10%,rgba(255,255,255,.55),transparent 60%),
    repeating-linear-gradient(0deg,transparent 0 26px,rgba(110,42,36,.05) 26px 27px);
}
#app{max-width:560px;margin:0 auto}
.masthead{text-align:center;margin-bottom:20px}
.masthead h1{font-family:'Marcellus',Georgia,serif;font-size:clamp(26px,7vw,34px);letter-spacing:.04em;color:var(--rail-green-deep);margin:8px 0 2px}
.masthead .sub{font-style:italic;font-size:15px;color:var(--brass);margin-bottom:8px}
.rule{height:3px;border-top:1px solid var(--rail-green);border-bottom:1px solid var(--rail-green);margin:0 auto;width:82%}
.panel{background:rgba(255,255,255,.42);border:1px solid rgba(31,74,56,.35);padding:20px 18px}
.panel.sell-panel{border-color:rgba(110,42,36,.5)}
.center{text-align:center}
.lede{font-size:16.5px;line-height:1.5;margin-bottom:14px}
.btn{font-family:'Marcellus',Georgia,serif;font-size:16px;letter-spacing:.05em;padding:12px 20px;cursor:pointer;border:1px solid var(--rail-green-deep);background:transparent;color:var(--rail-green-deep);transition:opacity .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.btn.primary{background:var(--rail-green);color:var(--paper);box-shadow:0 2px 0 var(--rail-green-deep)}
.btn.sell-btn{border-color:var(--oxblood-deep);color:var(--oxblood-deep)}
body.sell-theme .btn.primary,.sell-panel .btn.primary{background:var(--oxblood);box-shadow:0 2px 0 var(--oxblood-deep);border-color:var(--oxblood-deep)}
.btn.primary:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-color:rgba(31,74,56,.35);font-size:14px;padding:9px 14px}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.gap{height:10px}
.filter{width:100%;font-family:'Sorts Mill Goudy',Georgia,serif;font-size:16px;padding:10px 12px;background:var(--paper-deep);border:1px solid rgba(31,74,56,.4);color:var(--ink);margin-bottom:8px}
.filter:focus{outline:2px solid var(--brass);outline-offset:1px}
.trim-count{font-style:italic;font-size:14.5px;color:var(--rail-green);margin-bottom:10px;text-align:center}
.trim-list{list-style:none;max-height:60vh;overflow-y:auto;border:1px solid rgba(31,74,56,.25)}
.trim-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;background:transparent;border:none;border-bottom:1px solid rgba(31,74,56,.15);font-family:'Sorts Mill Goudy',Georgia,serif;font-size:16px;color:var(--ink);cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
.trim-row.out{opacity:.45}
.trim-row.out .trim-name{text-decoration:line-through}
.trim-name{flex:1}
.trim-mark{font-style:italic;font-size:13px;color:var(--oxblood);flex-shrink:0}
.scoreline{text-align:center;font-size:14.5px;letter-spacing:.06em;text-transform:uppercase;font-family:'Marcellus',Georgia,serif;color:var(--rail-green);margin:4px 0 8px}
.scoreline .dot{margin:0 8px;color:var(--brass)}
.sell-tag{color:var(--oxblood)}
.keep-tag{color:var(--rail-green-deep)}
.prompt{text-align:center;font-style:italic;font-size:15.5px;margin-bottom:14px;color:rgba(35,48,31,.75)}
.matchup{display:flex;flex-direction:column}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:128px;padding:18px;background:rgba(255,255,255,.55);border:1px solid var(--rail-green);outline:1px solid rgba(31,74,56,.3);outline-offset:-6px;cursor:pointer;font-family:inherit;color:var(--ink);transition:transform .2s,opacity .25s,background .2s;text-align:center;width:100%;-webkit-tap-highlight-color:transparent}
body.sell-theme .card{border-color:var(--oxblood);outline-color:rgba(110,42,36,.3)}
.card:active{transform:scale(.985)}
.card:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.card.chosen{background:rgba(31,74,56,.12);border-color:var(--brass)}
body.sell-theme .card.chosen{background:rgba(110,42,36,.12)}
.card.fallen{opacity:.25}
.box-frame{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border:1px solid rgba(35,48,31,.4);outline:3px solid var(--paper);outline-offset:-4px;background:var(--paper-deep);box-shadow:0 2px 6px rgba(0,0,0,.18);overflow:hidden;flex-shrink:0}
.box-img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.box-initials{font-family:'Marcellus',Georgia,serif;font-size:32px;color:rgba(255,255,255,.85);letter-spacing:.04em}
.card-eyebrow{font-family:'Marcellus',Georgia,serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
body.sell-theme .card-eyebrow{color:var(--oxblood)}
.card-name{font-family:'Marcellus',Georgia,serif;font-size:clamp(20px,5.6vw,26px);line-height:1.2;color:var(--rail-green-deep)}
body.sell-theme .card-name{color:var(--oxblood-deep)}
.vs{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}
.vs span{font-style:italic;font-size:15px;color:var(--brass)}
.vs::before,.vs::after{content:'';flex:1;border-top:1px solid rgba(166,124,46,.5)}
.toolbar{display:flex;justify-content:center;gap:10px;margin-top:18px}
.laurel{font-size:30px;color:var(--brass);margin-bottom:6px}
.crown-eyebrow{font-family:'Marcellus',Georgia,serif;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass);margin-bottom:6px}
.sell-panel .crown-eyebrow{color:var(--oxblood)}
.champ-cover{display:flex;justify-content:center;margin-bottom:10px}
.champ-cover .box-frame{width:128px;height:128px}
.champ-name{font-family:'Marcellus',Georgia,serif;font-size:clamp(24px,6.5vw,32px);color:var(--rail-green-deep);margin-bottom:12px}
.sell-panel .champ-name{color:var(--oxblood-deep)}
.price-links{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.price-links a{font-family:'Marcellus',Georgia,serif;font-size:15px;color:var(--oxblood);text-decoration:underline;text-underline-offset:3px}
.ledger{margin-top:26px;border:1px solid var(--rail-green);background:rgba(255,255,255,.35)}
.ledger.sell-ledger{border-color:var(--oxblood)}
.ledger-head{font-family:'Marcellus',Georgia,serif;display:flex;align-items:center;justify-content:space-between;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--paper);background:var(--rail-green);padding:8px 12px}
.ledger-head.sell-head{background:var(--oxblood)}
.copy{font-family:'Marcellus',Georgia,serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.5);color:var(--paper);padding:5px 10px;cursor:pointer}
.ledger ol{list-style:none}
.ledger li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid rgba(31,74,56,.18);font-size:16.5px}
.ledger li:first-child{border-top:none}
.rank{font-family:'Marcellus',Georgia,serif;color:var(--brass);min-width:26px;text-align:right;flex-shrink:0}
.ledger-name{color:var(--ink);flex:1}
.mini-links{display:flex;gap:10px;flex-shrink:0}
.mini-links a{font-size:13px;color:var(--oxblood);text-decoration:underline;text-underline-offset:2px}
.ledger-thumb{width:30px;height:30px;object-fit:contain;background:var(--paper-deep);border:1px solid rgba(35,48,31,.3);flex-shrink:0}
.thumb-fallback{display:inline-block}
.vault-label{font-family:'Marcellus',Georgia,serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-green);margin-bottom:6px}
.vault-code{width:100%;font-family:monospace;font-size:11px;padding:8px;background:var(--paper-deep);border:1px solid rgba(31,74,56,.4);color:var(--ink);word-break:break-all;margin-bottom:10px;resize:vertical}
.vault-divider{border-top:1px solid rgba(166,124,46,.5);margin:18px 0}
.vault-msg{font-style:italic;font-size:14.5px;margin-top:10px;color:var(--rail-green)}
.colophon{text-align:center;font-style:italic;font-size:13.5px;color:rgba(35,48,31,.55);margin-top:30px}
.link-btn{background:none;border:none;font:inherit;color:rgba(35,48,31,.55);text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){.card,.btn{transition:none}}
</style>
</head>

const IMG = {}, ID = {}, ALL = [];
for (const g of GAMES) { ALL.push(g.n); ID[g.n] = g.id; if (g.img) IMG[g.n] = g.img; }

const KEY = "collection-gauntlet:v1";

// ---------- state ----------
let S = {
  screen: "home", mode: "keep",
  keepers: [], sells: [], excluded: [],
  tourney: null, lastResult: null
};
let history = [];      // undo snapshots (not persisted)
let picked = null;     // animation lock
let filter = "";
let restoreMsg = "";
let saveOk = true;

// ---------- persistence (local to this device) ----------
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    saveOk = true;
  } catch (e) { saveOk = false; }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && Array.isArray(s.keepers)) {
      S = Object.assign(S, s);
      if (S.screen === "play" && !S.tourney) S.screen = "home";
      if (S.screen === "loading") S.screen = "home";
    }
  } catch (e) { /* fresh start */ }
}

// ---------- helpers ----------
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const ordinal = (n) => { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); };
const pool = () => ALL.filter((g) => !S.keepers.includes(g) && !S.sells.includes(g) && !S.excluded.includes(g));
const bggUrl = (n) => "https://boardgamegeek.com/market/browse?objecttype=thing&objectid=" + (ID[n] || "");
const ebayUrl = (n) => "https://www.ebay.com/sch/i.html?_nkw=" + encodeURIComponent(n + " board game") + "&LH_Sold=1&LH_Complete=1";
const encodeSave = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const decodeSave = (s) => JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
function hueFor(n) { let h = 0; for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0; return h % 360; }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    document.body.removeChild(ta);
  }
}

// ---------- tournament engine ----------
function drawPair(t) {
  let round = t.round.slice(), next = t.nextRound.slice(), rn = t.roundNum;
  while (true) {
    if (round.length >= 2) {
      const a = round.shift(), b = round.shift();
      return { round, nextRound: next, pair: [a, b], roundNum: rn };
    }
    if (round.length === 1) next.push(round.shift());
    if (next.length === 1 && round.length === 0) {
      return { round: [], nextRound: [], pair: null, roundNum: rn, champion: next[0] };
    }
    round = shuffle(next); next = []; rn += 1;
  }
}
const startTournament = (names) => drawPair({ round: shuffle(names), nextRound: [], pair: null, roundNum: 1 });

// ---------- actions ----------
function beginTournament(m) {
  const p = pool();
  if (p.length === 0) { S.screen = "done"; commit(); return; }
  if (p.length === 1) { finish(p[0], m); return; }
  S.mode = m; history = [];
  S.tourney = startTournament(p);
  S.screen = "play";
  commit();
}
function finish(name, m) {
  S.lastResult = { name, mode: m };
  if (m === "keep") S.keepers.push(name); else S.sells.push(name);
  S.tourney = null;
  S.screen = "champion";
  commit();
}
function pick(name) {
  if (!S.tourney || !S.tourney.pair || picked) return;
  picked = name;
  document.querySelectorAll(".card").forEach((c) => {
    c.classList.add(c.dataset.name === name ? "chosen" : "fallen");
  });
  setTimeout(() => {
    history.push(JSON.parse(JSON.stringify({ tourney: S.tourney, keepers: S.keepers, sells: S.sells, mode: S.mode, screen: S.screen })));
    if (history.length > 20) history.shift();
    const next = drawPair({ round: S.tourney.round, nextRound: S.tourney.nextRound.concat([name]), roundNum: S.tourney.roundNum });
    picked = null;
    if (next.champion) finish(next.champion, S.mode);
    else { S.tourney = next; commit(); }
  }, 260);
}
function undo() {
  const prev = history.pop();
  if (!prev) return;
  S.tourney = prev.tourney; S.keepers = prev.keepers; S.sells = prev.sells;
  S.mode = prev.mode; S.screen = prev.screen; S.lastResult = null;
  commit();
}
function toggleExcluded(name) {
  const i = S.excluded.indexOf(name);
  if (i >= 0) S.excluded.splice(i, 1); else S.excluded.push(name);
  save();
  renderTrimList();
}
function resetAll() {
  if (!confirm("Reset everything? Champions, sale ledger, and set-aside games will be cleared.")) return;
  S = { screen: "home", mode: "keep", keepers: [], sells: [], excluded: [], tourney: null, lastResult: null };
  history = [];
  try { localStorage.removeItem(KEY); } catch (e) {}
  commit();
}
function restoreFromCode() {
  const txt = document.getElementById("restore-input").value;
  try {
    const o = decodeSave(txt);
    if (!o || !Array.isArray(o.k) || !Array.isArray(o.s) || !Array.isArray(o.x)) throw new Error("bad");
    const valid = (n) => ALL.includes(n);
    S.keepers = o.k.filter(valid); S.sells = o.s.filter(valid); S.excluded = o.x.filter(valid);
    S.tourney = null; S.lastResult = null; history = [];
    restoreMsg = "Restored: " + o.k.length + " champions, " + o.s.length + " for sale, " + o.x.length + " set aside.";
  } catch (e) {
    restoreMsg = "That code didn't take \u2014 check that it was copied completely.";
  }
  commit();
}
function commit() { save(); render(); }

// ---------- view pieces ----------
function boxCover(name, cls) {
  const src = IMG[name];
  if (src) return '<span class="box-frame ' + (cls || "") + '"><img class="box-img" src="' + src + '" alt=""></span>';
  const hue = hueFor(name);
  const initials = esc(name.replace(/\(.*?\)/g, "").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join(""));
  return '<span class="box-frame ' + (cls || "") + '" style="background:linear-gradient(160deg,hsl(' + hue + ',38%,32%),hsl(' + ((hue + 40) % 360) + ',34%,20%))"><span class="box-initials">' + initials + "</span></span>";
}
function thumb(name) {
  const src = IMG[name];
  if (src) return '<img class="ledger-thumb" src="' + src + '" alt="">';
  return '<span class="ledger-thumb thumb-fallback" style="background:hsl(' + hueFor(name) + ',38%,32%)"></span>';
}
function ledgers() {
  let h = "";
  if (S.keepers.length) {
    h += '<section class="ledger"><div class="ledger-head"><span>Hall of Champions</span><button class="copy" data-act="copy-keep">Copy list</button></div><ol>';
    S.keepers.forEach((c, i) => {
      h += '<li><span class="rank">' + (i + 1) + "</span>" + thumb(c) + '<span class="ledger-name">' + esc(c) + "</span></li>";
    });
    h += "</ol></section>";
  }
  if (S.sells.length) {
    h += '<section class="ledger sell-ledger"><div class="ledger-head sell-head"><span>Sale Ledger</span><button class="copy" data-act="copy-sell">Copy list</button></div><ol>';
    for (const c of S.sells) {
      h += '<li><span class="rank">\u2022</span>' + thumb(c) + '<span class="ledger-name">' + esc(c) + '</span><span class="mini-links"><a href="' + bggUrl(c) + '" target="_blank" rel="noreferrer">BGG</a><a href="' + ebayUrl(c) + '" target="_blank" rel="noreferrer">eBay</a></span></li>';
    }
    h += "</ol></section>";
  }
  return h;
}
function colophon() {
  return '<footer class="colophon">' +
    (saveOk ? "Progress saves to this phone after every tap. " : "\u26a0 Local saving unavailable in this browser \u2014 use Backup &amp; restore. ") +
    '<button class="link-btn" data-act="reset">Reset everything</button></footer>';
}

// ---------- screens ----------
function render() {
  const app = document.getElementById("app");
  document.body.classList.toggle("sell-theme", S.screen === "play" && S.mode === "sell");
  const head = '<header class="masthead"><div class="rule"></div><h1>The Collection Gauntlet</h1><div class="sub">one shelf \u00b7 no mercy</div><div class="rule"></div></header>';
  let body = "";

  if (S.screen === "home") {
    const p = pool();
    body = '<div class="panel center"><p class="lede">' + p.length + " games await judgment" +
      (S.excluded.length ? " (" + S.excluded.length + " set aside)" : "") +
      ". Keep gauntlets crown the game you'd save first; sale gauntlets condemn the one you'd part with first.</p>" +
      '<button class="btn primary" data-act="begin-keep">Run a keep gauntlet</button><div class="gap"></div>' +
      '<button class="btn sell-btn" data-act="begin-sell">Run a sale gauntlet</button><div class="gap"></div>' +
      '<button class="btn ghost" data-act="trim">Review the pool \u00b7 remove games</button><div class="gap"></div>' +
      '<button class="btn ghost" data-act="vault">Backup &amp; restore progress</button></div>' + ledgers();
  }

  else if (S.screen === "trim") {
    body = '<div class="panel"><p class="lede">Tap a game to set it aside \u2014 it won\u0027t appear in any gauntlet. Tap again to bring it back.</p>' +
      '<input class="filter" id="trim-filter" type="text" placeholder="Filter by name\u2026" value="' + esc(filter) + '">' +
      '<div class="trim-count" id="trim-count"></div><ul class="trim-list" id="trim-list"></ul>' +
      '<div class="toolbar"><button class="btn primary" data-act="home">Done</button></div></div>';
  }

  else if (S.screen === "play" && S.tourney && S.tourney.pair) {
    const t = S.tourney, sell = S.mode === "sell";
    const left = t.round.length + t.nextRound.length + 2;
    body = '<div class="scoreline"><span class="' + (sell ? "sell-tag" : "keep-tag") + '">' + (sell ? "Sale gauntlet" : "Keep gauntlet") +
      '</span><span class="dot">\u00b7</span><span>Round ' + t.roundNum + '</span><span class="dot">\u00b7</span><span>' + left + " remain</span></div>" +
      '<p class="prompt">' + (sell ? "Tap the one you\u0027d sooner sell." : "Tap the one you\u0027d sooner keep.") + "</p>" +
      '<div class="matchup">';
    t.pair.forEach((name, i) => {
      if (i === 1) body += '<div class="vs"><span>versus</span></div>';
      body += '<button class="card" data-act="pick" data-name="' + esc(name) + '"><span class="card-eyebrow">' + (sell ? "Sell" : "Keep") +
        "</span>" + boxCover(name) + '<span class="card-name">' + esc(name) + "</span></button>";
    });
    body += '</div><div class="toolbar"><button class="btn ghost" data-act="undo"' + (history.length ? "" : " disabled") + '>Undo last pick</button>' +
      '<button class="btn ghost" data-act="home">Pause</button></div>' + ledgers();
  }

  else if (S.screen === "champion" && S.lastResult) {
    const r = S.lastResult, sell = r.mode === "sell", p = pool();
    const nextMode = S.mode === "keep" ? "sell" : "keep";
    body = '<div class="panel center' + (sell ? " sell-panel" : "") + '"><div class="laurel">' + (sell ? "\u2696" : "\u2766") + "</div>" +
      '<div class="crown-eyebrow">' + (sell ? "Marked for sale" : ordinal(S.keepers.length) + " enshrined") + "</div>" +
      '<div class="champ-cover">' + boxCover(r.name) + "</div>" +
      '<h2 class="champ-name">' + esc(r.name) + "</h2>";
    if (sell) {
      body += '<div class="price-links"><a href="' + bggUrl(r.name) + '" target="_blank" rel="noreferrer">BGG marketplace listings \u2197</a>' +
        '<a href="' + ebayUrl(r.name) + '" target="_blank" rel="noreferrer">eBay sold prices \u2197</a></div>';
    }
    body += '<p class="lede">' + (p.length ? p.length + " games remain in the pool." : "The shelf is fully judged.") + "</p>";
    if (p.length) {
      body += '<button class="btn primary" data-act="begin-' + nextMode + '">' + (nextMode === "sell" ? "Next: sale gauntlet" : "Next: keep gauntlet") + "</button><div class=\"gap\"></div>" +
        '<button class="btn ghost" data-act="begin-' + S.mode + '">Run another ' + (S.mode === "sell" ? "sale" : "keep") + " gauntlet instead</button>";
    } else {
      body += '<button class="btn primary" data-act="done">View the final ledgers</button>';
    }
    body += "</div>" + ledgers();
  }

  else if (S.screen === "vault") {
    const code = encodeSave({ k: S.keepers, s: S.sells, x: S.excluded });
    body = '<div class="panel"><p class="lede">Your save code captures the Hall of Champions, Sale Ledger, and set-aside games. Copy it somewhere safe (Notes works well) \u2014 paste it back here anytime to restore, even on another device.</p>' +
      '<div class="vault-label">Current save code</div><textarea class="vault-code" readonly rows="3">' + code + "</textarea>" +
      '<button class="btn primary" data-act="copy-code">Copy save code</button>' +
      '<div class="vault-divider"></div><div class="vault-label">Restore from a code</div>' +
      '<textarea class="vault-code" id="restore-input" rows="3" placeholder="Paste a save code here\u2026"></textarea>' +
      '<button class="btn ghost" data-act="restore">Restore</button>' +
      (restoreMsg ? '<p class="vault-msg">' + esc(restoreMsg) + "</p>" : "") +
      '<div class="toolbar"><button class="btn primary" data-act="home">Done</button></div></div>';
  }

  else if (S.screen === "done") {
    body = '<div class="panel center"><div class="laurel">\u2766</div><h2 class="champ-name">The ledger is complete</h2>' +
      '<button class="btn primary" data-act="reset">Start fresh</button></div>' + ledgers();
  }

  else { S.screen = "home"; render(); return; }

  app.innerHTML = head + body + colophon();

  if (S.screen === "trim") {
    renderTrimList();
    const f = document.getElementById("trim-filter");
    f.addEventListener("input", () => { filter = f.value; renderTrimList(); });
  }
  window.scrollTo(0, 0);
}

function renderTrimList() {
  const list = document.getElementById("trim-list");
  const count = document.getElementById("trim-count");
  if (!list) return;
  const q = filter.toLowerCase();
  const items = ALL.filter((g) => !S.keepers.includes(g) && !S.sells.includes(g) && (!q || g.toLowerCase().includes(q)));
  count.textContent = pool().length + " in the pool \u00b7 " + S.excluded.length + " set aside";
  list.innerHTML = items.map((g) => {
    const out = S.excluded.includes(g);
    return '<li><button class="trim-row' + (out ? " out" : "") + '" data-act="toggle" data-name="' + esc(g) + '">' +
      thumb(g) + '<span class="trim-name">' + esc(g) + '</span><span class="trim-mark">' + (out ? "set aside" : "\u2014") + "</span></button></li>";
  }).join("");
}

// ---------- event delegation ----------
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, name = el.dataset.name;
  if (act === "begin-keep") beginTournament("keep");
  else if (act === "begin-sell") beginTournament("sell");
  else if (act === "trim") { filter = ""; S.screen = "trim"; commit(); }
  else if (act === "vault") { restoreMsg = ""; S.screen = "vault"; commit(); }
  else if (act === "home") { S.screen = "home"; commit(); }
  else if (act === "done") { S.screen = "done"; commit(); }
  else if (act === "pick") pick(name);
  else if (act === "undo") undo();
  else if (act === "toggle") toggleExcluded(name);
  else if (act === "reset") resetAll();
  else if (act === "restore") restoreFromCode();
  else if (act === "copy-code") {
    copyText(encodeSave({ k: S.keepers, s: S.sells, x: S.excluded }));
    el.textContent = "Copied"; setTimeout(() => { el.textContent = "Copy save code"; }, 1600);
  }
  else if (act === "copy-keep") {
    copyText(S.keepers.map((g, i) => (i + 1) + ". " + g).join("\n"));
    el.textContent = "Copied"; setTimeout(() => { el.textContent = "Copy list"; }, 1600);
  }
  else if (act === "copy-sell") {
    copyText(S.sells.join("\n"));
    el.textContent = "Copied"; setTimeout(() => { el.textContent = "Copy list"; }, 1600);
  }
});

// flush on tab hide as extra insurance
document.addEventListener("visibilitychange", save);
window.addEventListener("pagehide", save);

// offline support
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

load();
render();
</script>
</body>
</html>
